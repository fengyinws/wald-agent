services:
  wald:
    build: .
    env_file: ./config/.env
    environment:
      WALD_ENV: production
      DATABASE_PATH: /app/data/wald.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wald-data:/app/data
    restart: unless-stopped
    stop_grace_period: 170s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  wald-data:
