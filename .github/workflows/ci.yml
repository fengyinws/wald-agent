name: Python service

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.1
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync ruff format --check src scripts tests
      - run: uv run --no-sync pytest --cov=wald_agent --cov-report=term-missing -q
      - run: uv build --wheel
      - name: Verify installed wheel outside the source tree
        run: |
          uv venv /tmp/wald-wheel-test
          uv pip install --python /tmp/wald-wheel-test/bin/python dist/*.whl
          cd /tmp
          /tmp/wald-wheel-test/bin/wald init --directory /tmp/wald-wheel-config
          /tmp/wald-wheel-test/bin/wald-compare --help

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wald-agent:test .
      - name: Verify startup, permissions, storage and readiness
        run: |
          docker run -d --name wald-test --read-only --tmpfs /tmp \
            --mount type=volume,destination=/app/data -p 127.0.0.1:8000:8000 \
            -e WALD_API_KEY=ci-only-0123456789-0123456789-0123456789 \
            -e LLM_API_KEY=ci-placeholder-no-network-calls wald-agent:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 1
          done
          docker logs wald-test
          exit 1
      - if: always()
        run: docker rm -f -v wald-test || true
